name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/yubajefffries/secondtab/blob/main/docs/CLA.md
          branch: cla-signatures
          allowlist: yubajefffries,dependabot[bot],*[bot]
          custom-notsigned-prcomment: >
            Thanks for the contribution! Before we can merge, we need you to sign our
            [Contributor License Agreement](https://github.com/yubajefffries/secondtab/blob/main/docs/CLA.md).
            It preserves the project's ability to stay sustainably open (see PRD §15) while you keep
            full rights to your own work. Sign by posting the comment below.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA ✅
